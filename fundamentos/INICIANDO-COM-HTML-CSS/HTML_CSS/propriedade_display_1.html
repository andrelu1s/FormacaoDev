<html lang="en">
<head>

        body{
            color: white;
        }

        div{
            display: block;
            background-color: red;

        span{

    <div>DIV #01</div>
    <div>DIV #02</div>
    <span>SPAN #01</span>
    <span>SPAN #02</span>
    
</body>
</html>
