<!-- Margin Collapse-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">    
    <title>Margin Collapse</title>
    <style>

        body{
            color: white;
        }

        .azul{
            background-color: blue;
        }  
        
        .vermelho{
            background-color: red;
        }

        .verde{
            background-color: green;
        }

        div, span{
            padding: 20px;
            margin: 5px;
        }

    </style>
</head>
<body>

    <span class="azul">1</span><span class="vermelho">2</span><span class="verde">3</span>
    <hr>
    <div class="azul">1</div>
    <div class="vermelho">2</div>
    <div class="verde">3</div>
    
</body>
</html>
